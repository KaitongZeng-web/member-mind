function runChat(){let v=$('#chatinput').value.trim();if(!v){toast('请先输入业务需求');return}chatHistory.push({role:'user',text:v});let words=v.match(/未续费|历史会员|杭州|可触达|风险/g)||[];let found=companies.filter(c=>(!v.includes('杭州')||c.region==='杭州')&&(!v.includes('未续费')||c.renewal==='未续费')&&(!v.includes('历史会员')||c.member==='历史会员')&&(!v.includes('可触达')||c.reachable==='可触达')&&(!v.includes('排除风险')||c.risk==='未见规则内风险'));let answer=found.length?'已根据本地演示会员台账整理 '+found.length+' 家候选企业。以下结果为规则模拟，非 DeepSeek 或企查查实时查询。请逐家核对资料后再开展服务。':'当前样例中没有完全符合条件的企业。未知资料不会自动视为匹配，可调整条件或补充档案。';chatHistory.push({role:'ai',text:answer});log('AI资料助理',v+'；候选 '+found.length+' 家');render();let box=document.createElement('div');box.className='resultbox';box.innerHTML='<h3>候选企业 · '+found.length+' 家</h3>'+table(['企业名称','地区','续费状态','联系情况','资料来源'],found.map(c=>[esc(c.name),esc(c.region),tag(c.renewal),tag(c.reachable),esc(c.source)]))+'<div class="noticebox">查询模式：本地规则模拟。真实模式需接入后端 DeepSeek + 企查查 MCP。当前没有发生外部 API 调用。</div>';$('#chatlog').appendChild(box)}

function runFilter(){let q=$('#filterq').value;let list=companies.filter(c=>(!q.includes('杭州')||c.region==='杭州')&&(!q.includes('未续费')||c.renewal==='未续费')&&(!q.includes('历史会员')||c.member==='历史会员')&&(!q.includes('可触达')||c.reachable==='可触达')&&(!q.includes('排除存在风险')||c.risk==='未见规则内风险'));let unknown=companies.filter(c=>c.reachable==='待核实'||c.risk==='待核实');$('#filterresult').innerHTML=card('筛选结果 · '+list.length+' 家符合',table(['企业','地区','会员状态','续费','联系','判断依据'],list.map(c=>[esc(c.name),esc(c.region),esc(c.member),tag(c.renewal),tag(c.reachable),esc('符合已知条件；风险：'+c.risk)])))+card('待核实 · '+unknown.length+' 家','<p class="sub">缺少联系或风险信息的企业单独列出，不自动计入符合名单。</p>'+table(['企业','缺失项','处理建议'],unknown.map(c=>[esc(c.name),esc([c.reachable==='待核实'?'联系情况':'',c.risk==='待核实'?'风险情况':''].filter(Boolean).join('、')), '补充资料并人工核验'])));log('会员筛选',q+'；匹配 '+list.length+' 家')}
function generateBrief(){let c=companies.find(x=>x.id===$('#briefco').value),date=$('#briefdate').value,target=$('#brieftarget').value;lastBrief={company:c.name,date,target};let facts=[['企业概况',c.name+'，所属行业：'+c.industry+'，地区：'+c.region],['会员情况','会员状态：'+c.member+'；续费状态：'+c.renewal+'；联系情况：'+c.reachable],['经营与资质','经营状态：'+c.operation+'；资质：'+c.qualification+'；风险：'+c.risk],['近期动态',c.note],['本次拜访目标',target],['建议沟通问题','1. 近期经营重点与业务变化？ 2. 对会员服务和政策资源有哪些需求？ 3. 续费意向与主要顾虑？'],['待核实事项',[c.reachable==='待核实'?'联系人及可触达情况':'',c.qualification==='待核实'?'资质有效性':'',c.risk==='待核实'?'风险信息':''].filter(Boolean).join('；')||'暂无额外待核实项']];let html='<div class="resultbox"><div class="eyebrow">VISIT BRIEF · '+esc(date)+'</div><h2>'+esc(c.name)+' · 拜访简报</h2><p class="sub">生成方式：本地模板与演示资料 · 非大模型生成</p>'+facts.map(f=>'<div class="trace"><b>'+f[0]+'</b><span>'+esc(f[1])+'</span></div>').join('')+'<div class="noticebox">来源追溯：'+esc(c.source)+'，资料日期 '+esc(c.date)+'。以上信息为模拟数据，正式拜访前应核验来源与时效。</div>'+btn('下载简报 TXT','downloadBrief()')+'　'+btn('转为拜访计划','makePlan()',true)+'</div>';$('#briefout').innerHTML=html;log('拜访简报','生成 '+c.name+' 拜访简报')}
function downloadBrief(){if(!lastBrief)return;let c=companies.find(x=>x.name===lastBrief.company);let txt='企服智台｜企业拜访简报\n企业：'+c.name+'\n拜访日期：'+lastBrief.date+'\n\n企业概况：'+c.industry+' / '+c.region+'\n会员：'+c.member+'；续费：'+c.renewal+'；联系：'+c.reachable+'\n经营状态：'+c.operation+'；资质：'+c.qualification+'；风险：'+c.risk+'\n近期动态：'+c.note+'\n拜访目标：'+lastBrief.target+'\n\n说明：演示数据，非实时外部查询。来源：'+c.source+'（'+c.date+'）';download(txt,c.name+'-拜访简报.txt','text/plain')}

function downloadMeeting(){let rows=[['企业名称','行业','地区','状态'],...(window.meetingMatches||[]).map(c=>[c.name,c.industry,c.region,'待人工确认'])];download(rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'会议邀请候选.csv','text/csv')}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+content],{type:type+';charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){let rows=[['企业名称','行业','地区','会员状态','续费','联系','经营状态','资质','风险','来源','资料日期'],...companies.map(c=>[c.name,c.industry,c.region,c.member,c.renewal,c.reachable,c.operation,c.qualification,c.risk,c.source,c.date])];download(rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'企服智台-企业档案.csv','text/csv')}
function exportAll(){download(JSON.stringify({exportedAt:new Date().toISOString(),mode:'offline-demo',companies,plans,records},null,2),'企服智台-工作空间备份.json','application/json')}
function resetData(){if(!confirm('确定重置本地演示数据？此操作会清除当前浏览器中的演示修改。'))return;companies=structuredClone(initial);plans=[];records=[];save();render();toast('演示数据已重置')}
render();
</script></body></html>
